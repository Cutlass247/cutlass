name: Landing page

# This repo's Pages site (https://cutlass247.github.io/cutlass/) now serves
# nothing but a redirect.
#
# The landing page itself lives at https://cutlass247.github.io/, which is a
# GitHub *user site* served from a different repository. For months both
# addresses served a copy of the page — this one deployed from site/, the root
# one hand-edited — and they drifted far enough apart that the root was still
# offering a button that had been replaced and a feature that had been pulled.
#
# So: one page, one URL. site/index.html is still the source, and
# scripts/publish-site.sh pushes it to the root site. The check job below is
# what stops the two drifting again — it fails when the published page no
# longer matches site/index.html, which is the thing nobody noticed by eye.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "site-redirect/**"
      - "scripts/publish-site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Fails when https://cutlass247.github.io/ is serving something other than
  # site/index.html. Expected to fail on the commit that changes the page and
  # to pass once scripts/publish-site.sh has been run — a red check here means
  # "you edited the page and didn't publish it", not "the build is broken".
  check-root-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/publish-site.sh --verify

  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-redirect
      - id: deploy
        uses: actions/deploy-pages@v4
