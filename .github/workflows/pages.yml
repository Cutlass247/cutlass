name: Landing page

# Publishes site/ to GitHub Pages.
#
# A workflow rather than the simpler branch-and-folder setting, because that
# one can only serve the repository root or /docs, and several docs already
# point at site/index.html. Moving the file to satisfy the setting would break
# those instead.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Stamp the page with when it was published, so a stale copy in
      # somebody's browser is visible rather than something you have to
      # diff against the repo to notice.
      - name: Stamp the build date
        run: |
          STAMP="updated $(date -u '+%Y-%m-%d %H:%M UTC') · $(git rev-parse --short HEAD)"
          sed -i "s|__BUILD_STAMP__|$STAMP|g" site/index.html
          grep -o 'updated [^<]*' site/index.html | head -1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
