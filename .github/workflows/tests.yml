name: Tests

# Runs the parts of scripts/hooks/pre-push that can run on a clean machine.
#
# The hook is wired up through `core.hooksPath`, which is local git config: it
# does not travel with a clone. So until this existed, every test in the repo
# was skipped by a push with --no-verify, a push from another machine, an edit
# made in the GitHub web UI, and every pull request. Tests that only run where
# they happen to be set up are a habit, not a safety net.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Windows because it is the platform Cutlass ships on, and because the bugs
    # that have actually cost time here were Windows-specific: a delete failing
    # on an open handle, a path with spaces, CRLF. Linux would be cheaper and
    # would have caught none of them.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      - name: Typecheck
        working-directory: apps/desktop
        run: npx tsc --noEmit

      # --all-targets compiles tests, examples and benches, not just what ships.
      # That is the point: a harness that stops compiling takes its coverage
      # with it silently, and the export deadlock lived in exactly that gap for
      # months.
      - name: cargo check (incl. tests and examples)
        run: cargo check -p cutlass-core -p cutlass-license -p cutlass-license-server -p cutlass-sync-server --all-targets

      # --all-features, because a test behind an off-by-default feature does not
      # run otherwise and nothing says so. The licensing crate's only
      # signature-verification test was invisible for that reason.
      - name: cargo test
        run: cargo test -p cutlass-core -p cutlass-license -p cutlass-license-server -p cutlass-sync-server --all-features

      - name: What this run does not cover
        if: always()
        shell: bash
        run: |
          cat <<'NOTE'
          Not run here, and not by accident:

          cutlass-engine and cutlass-desktop (23 tests) link ffmpeg-sys-the-third
          against vendor/ffmpeg, which is gitignored — a specific LGPL build with
          the exact filters and encoders export depends on. A clean checkout has
          no ffmpeg to link against, and fetching some other build in CI would
          test something we do not ship. Those 23 run in the pre-push hook.

          The export harnesses (scripts/run-harnesses.sh) need real footage and a
          real encoder. They stay step 4 of beta/RELEASING.md, by hand. One of
          them caught a stranded export folder on 2026-09-16 that nothing else
          would have.
          NOTE
