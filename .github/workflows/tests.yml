name: Tests

# Runs the same checks as scripts/hooks/pre-push, on GitHub rather than on one
# machine.
#
# The hook is wired up through `core.hooksPath`, which is local git config: it
# does not travel with a clone. So until this existed, every test in the repo
# was skipped by a push with --no-verify, a push from any other machine, an edit
# made in the GitHub web UI, and every pull request. 108 tests that only ever
# ran where they happened to be set up are not a safety net, they are a habit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes one still running; nobody needs the result for a
# commit that has already been replaced.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Windows because it is the only platform Cutlass supports, and because the
    # bugs that have actually cost time here were Windows-specific: a delete
    # failing on an open handle, a path with spaces, CRLF. Testing on Linux
    # would be cheaper and would not have caught any of them.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # whisper-rs and tract build native code, so this is the slow part by far.
      # Keyed on the lockfile: dependencies change rarely, our own code changes
      # constantly, and only the former invalidates it.
      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      # Before the Rust steps: it takes seconds, and a type error should not
      # wait behind a native build to be reported.
      - name: Typecheck
        working-directory: apps/desktop
        run: npx tsc --noEmit

      # tauri-build reads frontendDist (../dist) at compile time, and dist/ is
      # gitignored. Without this, `cargo check` on cutlass-desktop fails in CI
      # for a reason that has nothing to do with the code.
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      # --all-targets compiles tests, examples and benches, not just what ships.
      # That is the point: a harness that stops compiling takes its coverage
      # with it silently, and the export deadlock lived in exactly that gap for
      # months.
      - name: cargo check (incl. tests and examples)
        run: cargo check --workspace --all-targets

      # --all-features, because a test behind an off-by-default feature does not
      # run otherwise and nothing says so. The licensing crate's only
      # signature-verification test was invisible for that reason.
      - name: cargo test
        run: cargo test --workspace --all-features

      # Not run here, and deliberately: scripts/run-harnesses.sh needs real
      # footage and a real encoder, so it cannot live in CI. It is step 4 of
      # beta/RELEASING.md and it stays a human step — it caught a stranded
      # export folder on 2026-09-16 that nothing else would have.
      - name: Note what this does not cover
        if: always()
        run: echo "Export harnesses are not run here - see beta/RELEASING.md step 4."
