<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cutlass</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://cutlass247.github.io/" />

<!--
  This is all that /cutlass/ serves now.

  The landing page lives at https://cutlass247.github.io/ and nowhere else.
  For months this path served a *second* copy of it, deployed from this repo
  while the root was hand-edited in Cutlass247/Cutlass247.github.io. They
  drifted, and the two URLs started showing different prices and different
  buttons to different people.

  This path stays alive rather than 404ing because links to it are already
  out in the world — the Lemon Squeezy review, beta/PRICING.md, anyone who
  bookmarked it. A dead link to your own store is worse than a hop.
-->
<meta http-equiv="refresh" content="0; url=https://cutlass247.github.io/" />
<script>
  // Carry the fragment across, so /cutlass/#download still lands on the
  // download section rather than at the top of the page.
  location.replace("https://cutlass247.github.io/" + location.hash);
</script>
<style>
  html { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #181818; color: #d9dde3;
    font: 16px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 24px; text-align: center;
  }
  a { color: #e8b339; }
</style>
</head>
<body>
  <!-- Seen only if the redirect is blocked, which is rare but not never. -->
  <p>Cutlass has moved to <a href="https://cutlass247.github.io/">cutlass247.github.io</a>.</p>
</body>
</html>
