[package]
name = "cutlass-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.103"
automerge = "0.10.0"
ffmpeg-sidecar = "2.5.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Free space before a staged export. Windows-only: the check is about a
# Windows install path, and the rest of the crate builds without it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
# Camera RAW photos, developed by Windows' own decoder (WIC, with Microsoft's
# Raw Image Extension): ffmpeg can't read them. Already in the build through
# Tauri, at this version.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
