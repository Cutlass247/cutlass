[package]
name = "cutlass-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
automerge = "0.10.0"
base64 = "0.22.1"
cutlass-core = { path = "../../../crates/cutlass-core" }
cutlass-engine = { path = "../../../crates/cutlass-engine" }
futures-util = "0.3.32"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1.52.4", features = ["sync", "macros", "net", "time", "rt"] }
tokio-tungstenite = "0.30.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }
